name: Build XCFramework

# The slow half of a release: flattens simonbs/Runestone + Vendor/RunestoneEditor
# into one module, archives every slice, and publishes the zip as an
# upstream.<version>-<rev> release. Then hands off to Release Package, which
# never rebuilds — it only points Package.swift at the published binary.
#
# Weekly schedule: builds only when the newest simonbs/Runestone tag has no
# upstream.* release yet, re-pinning Upstream.versions to it. Manual runs build
# the pinned version (next rev) unless upstream_version says otherwise.

on:
  workflow_dispatch:
    inputs:
      upstream_version:
        description: "simonbs/Runestone version to build. Leave empty to keep the pinned version, or enter `latest` or a tag such as 0.5.3 to re-pin and commit it."
        required: false
        type: string
      release_package:
        description: "Run Release Package with the new upstream tag after the binary is published."
        required: false
        type: boolean
        default: true
      package_version:
        description: "Package version for Release Package, for example 0.2.1. Leave empty to bump the patch of the latest package version."
        required: false
        type: string
  schedule:
    - cron: "0 3 * * 1" # Monday 03:00 UTC

permissions:
  contents: write
  actions: write

concurrency:
  group: build-xcframework
  cancel-in-progress: false

jobs:
  plan:
    name: Resolve Upstream
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      upstream_version: ${{ steps.plan.outputs.upstream_version }}
      upstream_ref: ${{ steps.plan.outputs.upstream_ref }}
      tag: ${{ steps.plan.outputs.tag }}
      package_version: ${{ steps.plan.outputs.package_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Every decision is made here, before the expensive job: which upstream
      # commit, which upstream tag, and which package version. Anything invalid
      # fails in seconds instead of after a multi-hour build.
      - name: Resolve Upstream
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED: ${{ inputs.upstream_version }}
          RELEASE_PACKAGE: ${{ inputs.release_package }}
          REQUESTED_PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            REQUESTED=latest
          fi
          resolved=$(./Script/resolve-upstream.sh "$REQUESTED")
          eval "$resolved"

          BUILD=true
          if [ "$EVENT_NAME" = "schedule" ]; then
            rc=0
            ./Script/next-tag.sh has-upstream "$RUNESTONE_VERSION" || rc=$?
            case "$rc" in
              0)
                echo "[*] simonbs/Runestone $RUNESTONE_VERSION already has an upstream.* release; nothing to build"
                BUILD=false
                ;;
              1) ;;
              *) exit "$rc" ;;
            esac
          fi
          TAG=$(./Script/next-tag.sh upstream "$RUNESTONE_VERSION")

          PACKAGE_VERSION=""
          if [ "$EVENT_NAME" = "schedule" ] || [ "$RELEASE_PACKAGE" = "true" ]; then
            PACKAGE_VERSION=${REQUESTED_PACKAGE_VERSION:-$(./Script/next-tag.sh package)}
            if ! echo "$PACKAGE_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "[!] package_version must be semantic, for example 0.2.1. Received: $PACKAGE_VERSION"
              exit 1
            fi
            rc=0
            ./Script/next-tag.sh exists "$PACKAGE_VERSION" || rc=$?
            case "$rc" in
              0)
                echo "[!] Package version $PACKAGE_VERSION is already released. Choose a new version."
                exit 1
                ;;
              1) ;;
              *) exit "$rc" ;;
            esac
          fi

          echo "[*] simonbs/Runestone $RUNESTONE_VERSION ($RUNESTONE_REF) -> $TAG, build=$BUILD, package=${PACKAGE_VERSION:-none}"
          {
            echo "build=$BUILD"
            echo "upstream_version=$RUNESTONE_VERSION"
            echo "upstream_ref=$RUNESTONE_REF"
            echo "tag=$TAG"
            echo "package_version=$PACKAGE_VERSION"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build & Publish
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: macos-26
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      # Write exactly the pair the plan job resolved; no second lookup.
      - name: Pin Upstream
        run: ./Script/resolve-upstream.sh "${{ needs.plan.outputs.upstream_version }}" --ref "${{ needs.plan.outputs.upstream_ref }}" --write

      - name: Build XCFramework
        run: ./Script/build.sh

      # build.sh points Package.swift at BinaryTarget/, so this tests the exact
      # bytes about to be published. A broken binary must not become an
      # immutable upstream.* release.
      - name: Compile Test
        run: ./Script/test.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Runestone.xcframework
          path: build/Runestone.xcframework.zip
          if-no-files-found: error
          retention-days: 14

      - name: Commit Upstream Pin
        id: pin
        env:
          RUNESTONE_VERSION: ${{ needs.plan.outputs.upstream_version }}
          RUNESTONE_REF: ${{ needs.plan.outputs.upstream_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Upstream.versions
          if git diff --cached --quiet; then
            echo "[*] Upstream.versions unchanged"
          else
            git commit -m "upstream: simonbs/Runestone $RUNESTONE_VERSION ($RUNESTONE_REF)"
            # main may have moved during the build; replay the pin on top of it.
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish Upstream Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}
          RUNESTONE_VERSION: ${{ needs.plan.outputs.upstream_version }}
          RUNESTONE_REF: ${{ needs.plan.outputs.upstream_ref }}
          TARGET_SHA: ${{ steps.pin.outputs.sha }}
        run: |
          # The tag was chosen hours ago; make sure nobody took it since. A
          # network error must fail here, not read as "free".
          rc=0
          ./Script/next-tag.sh exists "$TAG" || rc=$?
          case "$rc" in
            0)
              echo "[!] Upstream tag $TAG already exists. Re-run the workflow to pick the next rev."
              exit 1
              ;;
            1) ;;
            *) exit "$rc" ;;
          esac
          SHA256=$(shasum -a 256 build/Runestone.xcframework.zip | awk '{print $1}')
          NOTES="$RUNNER_TEMP/upstream-release-notes.md"
          {
            echo "Prebuilt Runestone XCFramework: iOS, iOS Simulator, Mac Catalyst, visionOS, visionOS Simulator."
            echo
            echo "- simonbs/Runestone \`$RUNESTONE_VERSION\` (\`$RUNESTONE_REF\`)"
            echo "- Tree-sitter runtime, Simon Støvring's language grammars, and themes from \`Vendor/RunestoneEditor\` at \`$TARGET_SHA\`"
            echo "- Xcode: $(xcodebuild -version | tr '\n' ' ')"
            echo "- SHA256: \`$SHA256\`"
            echo
            echo "Binary-only release. To add Runestone to a Swift package, use a versioned package release instead."
          } > "$NOTES"
          gh release create "$TAG" \
            --target "$TARGET_SHA" \
            --latest=false \
            --title "Runestone XCFramework $TAG" \
            --notes-file "$NOTES" \
            build/Runestone.xcframework.zip
          echo "[*] published $TAG ($SHA256)"

      - name: Dispatch Release Package
        if: needs.plan.outputs.package_version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.package_version }}
        run: |
          echo "[*] dispatching Release Package $VERSION <- $TAG"
          gh workflow run release.yml \
            --ref "$GITHUB_REF_NAME" \
            -f package_version="$VERSION" \
            -f upstream_tag="$TAG"
