name: Release Package

# The fast half of a release. Never compiles the XCFramework: it takes a binary
# already published by Build XCFramework (upstream.<version>-<rev>), points
# Package.swift at it, proves the manifest resolves and links on every
# platform, commits, and tags the Swift package version.

on:
  workflow_dispatch:
    inputs:
      package_version:
        description: "Package version to publish, for example 0.2.1."
        required: true
        type: string
      upstream_tag:
        description: "Binary release to ship, for example upstream.0.5.2-1 (published by Build XCFramework)."
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-package
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Validate Inputs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_VERSION: ${{ inputs.package_version }}
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
        run: |
          if ! echo "$PACKAGE_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "[!] package_version must be semantic, for example 0.2.1: $PACKAGE_VERSION"
            exit 1
          fi
          if ! echo "$UPSTREAM_TAG" | grep -Eq '^upstream\.[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$'; then
            echo "[!] upstream_tag must look like upstream.0.5.2-1: $UPSTREAM_TAG"
            exit 1
          fi

          git fetch --tags origin
          if git rev-parse "refs/tags/$PACKAGE_VERSION" >/dev/null 2>&1; then
            echo "[!] package tag already exists: $PACKAGE_VERSION"
            exit 1
          fi
          if ! gh release view "$UPSTREAM_TAG" --json assets --jq '.assets[].name' | grep -qx 'Runestone.xcframework.zip'; then
            echo "[!] release $UPSTREAM_TAG is missing Runestone.xcframework.zip"
            exit 1
          fi

      - name: Download Binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
        run: |
          mkdir -p build
          gh release download "$UPSTREAM_TAG" --pattern Runestone.xcframework.zip --dir build --clobber
          ls -la build/Runestone.xcframework.zip

      - name: Write Release Manifest
        env:
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
        run: |
          ./Script/build-manifest.sh build/Runestone.xcframework.zip \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$UPSTREAM_TAG/Runestone.xcframework.zip"

      - name: Compile Test
        run: ./Script/test.sh

      - name: Commit Manifest
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Package.swift
          if git diff --cached --quiet; then
            echo "[*] Package.swift unchanged"
          else
            git commit -m "release: $PACKAGE_VERSION ($UPSTREAM_TAG)"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Create Package Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_VERSION: ${{ inputs.package_version }}
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
        run: |
          source ./Upstream.versions
          SHA256=$(shasum -a 256 build/Runestone.xcframework.zip | awk '{print $1}')
          NOTES="$RUNNER_TEMP/package-release-notes.md"
          {
            echo "Runestone $PACKAGE_VERSION"
            echo
            echo "Combined prebuilt XCFramework:"
            echo "- Runestone (simonbs/Runestone \`$RUNESTONE_VERSION\`)"
            echo "- Tree-sitter runtime and Simon Støvring's language grammars"
            echo "- Tomorrow / One Dark / Plain Text themes"
            echo "- RunestoneEditor convenience API"
            echo
            echo "Binary: \`$UPSTREAM_TAG\` / Runestone.xcframework.zip"
            echo "SHA256: \`$SHA256\`"
          } > "$NOTES"
          gh release create "$PACKAGE_VERSION" \
            --target "$(git rev-parse HEAD)" \
            --latest \
            --title "Runestone $PACKAGE_VERSION" \
            --notes-file "$NOTES"
          echo "[*] published $PACKAGE_VERSION -> $UPSTREAM_TAG"
